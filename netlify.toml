# Netlify Configuration for OCare Phinas (Next.js 16 + React 19)

[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Next.js inlines NEXT_PUBLIC_* variables into client bundles and static HTML by design.
  # Omit them from Netlify Secrets Scanning so the build doesn't fail on public variables.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

# Official Next.js Runtime plugin for App Router, SSR, and API routes
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# Edge Functions (intercepts and blocks scraper bots at the global edge network)
[[edge_functions]]
  path = "/*"
  function = "block-bots"

# Aggressive edge caching headers for static assets (reduces repeat bandwidth to 0)
[[headers]]
  for = "/categories/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brands/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.(png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
