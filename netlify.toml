# Netlify Configuration for OCare Phinas (Next.js 16 + React 19)

[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Next.js inlines NEXT_PUBLIC_* variables into client bundles and static HTML by design.
  # Omit them from Netlify Secrets Scanning so the build doesn't fail on public variables.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

# Official Next.js Runtime plugin for App Router, SSR, and API routes
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

